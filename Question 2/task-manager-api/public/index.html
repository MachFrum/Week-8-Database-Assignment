<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clinic Patient Search</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    button { margin-left: 10px; }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="container">
      <h1>Search for a Patient</h1>
      <input type="text" id="nameInput" placeholder="Enter patient name..." />
      <button onclick="searchPatient()">Search</button>
      
      <div id="result" class="result"></div>

      <hr>
      <h2>Create New User</h2>
      <form id="createUserForm">
        <input type="text" id="newUsername" placeholder="Username" required />
        <input type="email" id="newEmail" placeholder="Email (optional)" />
        <button type="submit">Create User</button>
      </form>
      <div id="createUserResult"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
